name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      # Includes the Phase 3B guardrail adversarial fixture suite
      # (tests/test_guardrail.py) — a non-zero exit here is a regression gate.
      - name: Run test suite
        run: python -m pytest -q
